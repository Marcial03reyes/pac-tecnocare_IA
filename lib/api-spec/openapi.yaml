openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /chat/status/{requestId}:
    get:
      operationId: pacChatProgress
      summary: Authenticated progress of one assistant request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Request progress without model identifiers or tool data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PacChatProgress"
  /chat:
    post:
      operationId: pacChat
      tags: [chat]
      summary: Asistente PAC authenticated chat and explicitly confirmed writes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacChatInput"
      responses:
        "200":
          description: Answer, pending proposal, or confirmed write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PacChatReply"
        "401":
          description: Invalid or expired Supabase session
        "409":
          description: Proposal expired, already executing, or source record changed
        "503":
          description: AI provider or data service unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PacChatMessage:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          maxLength: 16000
    PacChatInput:
      type: object
      required: [action, history]
      properties:
        action:
          type: string
          enum: [message, confirm, correct]
        history:
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/PacChatMessage"
        confirmationId:
          type: string
        requestId:
          type: string
          description: Per-message idempotency key, reused when retrying the same request
        conversationId:
          type: string
          maxLength: 100
          description: Opaque conversation identifier, scoped to the authenticated user
    PacChatProgress:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [thinking, retrying, fallback, done, error]
        message:
          type: string
    PacChatProposal:
      type: object
      required: [id, tool, title, fields, expiresAt]
      properties:
        id:
          type: string
        tool:
          type: string
        title:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PacChatField"
        expiresAt:
          type: string
    PacChatField:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    PacChatReply:
      type: object
      required: [text]
      properties:
        text:
          type: string
        proposal:
          $ref: "#/components/schemas/PacChatProposal"
        contactId:
          type: string
        saved:
          type: boolean
        partial:
          type: boolean
        retryable:
          type: boolean
        notice:
          type: string
          description: Discreet operational notice, without secret values or provider details.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

